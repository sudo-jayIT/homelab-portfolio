name: Mirror to Gitea

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  delete:

jobs:
  mirror:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git remote add gitea "https://homelab-ops:${GITEA_TOKEN}@192.168.3.115:3000/homelab-ops/homelab-portfolio.git" || \
            git remote set-url gitea "https://homelab-ops:${GITEA_TOKEN}@192.168.3.115:3000/homelab-ops/homelab-portfolio.git"
          git push gitea --all
          git push gitea --tags
